services:
  postgres:
    image: postgres:16
    container_name: entity_risk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-risk_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-risk_radar}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - entity_risk_network

  minio:
    image: minio/minio:latest
    container_name: entity_risk_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - entity_risk_network
  
  ingestion:
    image: python:3.11-slim
    container_name: entity_risk_ingestion
    restart: "no"
    working_dir: /app
    env_file:
      - .env
    volumes:
      - ./:/app
    networks:
      - entity_risk_network
    depends_on:
      - minio
      - postgres
    command: tail -f /dev/null

volumes:
  postgres_data:  
  minio_data:

networks:
  entity_risk_network:
    driver: bridge